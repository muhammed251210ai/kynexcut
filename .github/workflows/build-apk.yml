name: Build KynexCut Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: JDK 17 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle Wrapper İzni Ver
      run: chmod +x gradlew

    - name: Anahtarı Kasadan Çöz ve key.properties Üret
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        printf "%s" "$SIGNING_KEY" | base64 --decode > ikynex-release-key.jks
        test -s ikynex-release-key.jks
        keytool -list -keystore ikynex-release-key.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null
        cat << EOC > key.properties
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=../ikynex-release-key.jks
        EOC

    - name: İmzalı Release APK Derle
      run: ./gradlew assembleRelease -x test -x lint --no-daemon

    - name: APK Dosyasını Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: KynexCut-Signed-APK
        path: app/build/outputs/apk/release/*release*.apk
