name: Build KynexCut Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: JDK 17 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle Wrapper İzni Ver
      run: chmod +x gradlew

    - name: Anahtarı Kasadan Çöz ve key.properties Üret
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      run: |
        set -euo pipefail
        printf "%s" "$KEYSTORE_BASE64" | base64 --decode > ikynex-release-key.jks
        test -s ikynex-release-key.jks
        keytool -list -keystore ikynex-release-key.jks -storepass "$KEY_PASSWORD" >/dev/null
        cat << EOC > key.properties
        storePassword=$KEY_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=../ikynex-release-key.jks
        EOC

    - name: İmzalı Release APK Derle
      run: ./gradlew assembleRelease -x test -x lint --no-daemon

    - name: Google Console için SHA-256 Parmak İzini Göster
      shell: bash
      env:
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      run: |
        set -euo pipefail
        echo "İmzalama sertifikasının SHA-256 parmak izi:"
        keytool -list -v \
          -keystore ikynex-release-key.jks \
          -alias "$KEY_ALIAS" \
          -storepass "$KEY_PASSWORD" \
          | grep -E 'SHA256:|SHA-256:'

    - name: APK Dosyasını Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: KynexCut-Signed-APK
        path: app/build/outputs/apk/release/*release*.apk
